{% extends "layout.html" %}{% block subtitle %}sign in{% endblock %}{% block content %}
<form class="card" method="post" action="{{ url_for('login') }}" style="max-width:380px;margin:60px auto">
  <div style="text-align:center;margin-bottom:14px"><img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="56" height="56"></div>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field"><label for="u">User name</label>
  <input id="u" type="text" name="username" autocomplete="username" autofocus required></div>
  <div class="field"><label for="p">Password</label>
  <input id="p" type="password" name="password" autocomplete="current-password" required></div>
  <button class="btn" style="width:100%">Sign in</button>
</form>
{% endblock %}

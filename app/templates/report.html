{% extends "layout.html" %}{% set nav="report" %}{% block subtitle %}{{ site }} — usage report{% endblock %}{% block content %}
<form class="card" method="get" action="{{ url_for('report') }}">
  <div class="row">
    <div class="field"><label>Site</label><select name="site">{% for s in sites %}<option {{ 'selected' if s==site }}>{{ s }}</option>{% endfor %}</select></div>
    <div class="field"><label>From</label><input type="date" name="start" value="{{ start }}" min="{{ st.days[0] }}" max="{{ st.days[-1] }}"></div>
    <div class="field"><label>To</label><input type="date" name="end" value="{{ end }}" min="{{ st.days[0] }}" max="{{ st.days[-1] }}"></div>
    {% include '_viewtoggle.html' %}
    <input type="hidden" name="view" value="{{ view }}">
    <button class="btn">Show</button>
    <button class="btn secondary" id="dl1" name="download" value="1">Download Excel</button>
    <button class="btn secondary" id="dl2" name="download" value="device">Download per device</button>
  </div>
  {% if st.gaps %}<div class="hint mt">Missing days in store: {{ st.gaps|join(', ') }}</div>{% endif %}
</form>
{% include '_daily.html' %}
{% endblock %}

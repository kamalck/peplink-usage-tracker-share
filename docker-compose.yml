services:
  peplink-usage-tracker:
    build: .
    container_name: peplink-usage-tracker
    restart: unless-stopped
    ports:
      - "5020:5020"
    volumes:
      - ./data:/app/data
    environment:
      # Values come from the untracked .env next to this file (see .env.example).
      - SECRET_KEY=${SECRET_KEY:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_USERS=${ADMIN_USERS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5020/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
